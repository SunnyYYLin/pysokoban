[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysokoban"
version = "2.0.0"
description = "Sokoban as a testbed for the Chronicle of AI Search Algorithms (1950s - Present)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sunny Lin", email = "sunnylinyy@outlook.com" }
]
keywords = [
    "sokoban", "ai", "search-algorithms", "heuristic-search",
    "astar", "bidirectional-search", "mcts", "benchmark", "pygame"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pygame-ce>=2.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
pysokoban = "pysokoban.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pysokoban"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
